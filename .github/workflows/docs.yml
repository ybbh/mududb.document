name: Build and Publish Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mududb-documentation
  cancel-in-progress: true

jobs:
  build:
    name: Build static documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build all versions and languages
        run: python scripts/build_docs.py --clean

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: mududb-document-html
          path: build/html
          if-no-files-found: error

  publish:
    name: Publish generated HTML
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: mududb-document-html
          path: build/html

      - name: Configure deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOCS_DEPLOY_KEY }}

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DOCS_DEPLOY_REPOSITORY }}
          ref: ${{ vars.DOCS_DEPLOY_BRANCH || 'main' }}
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: publish-repo

      - name: Publish artifact into target directory
        env:
          DOCS_DEPLOY_DIR: ${{ vars.DOCS_DEPLOY_DIR || 'mududb/docs' }}
        run: |
          set -euo pipefail
          rm -rf "publish-repo/${DOCS_DEPLOY_DIR}"
          mkdir -p "publish-repo/${DOCS_DEPLOY_DIR}"
          cp -a build/html/. "publish-repo/${DOCS_DEPLOY_DIR}/"
          cd publish-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DOCS_DEPLOY_DIR}"
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
          else
            git commit -m "Publish MuduDB documentation"
            git push origin HEAD:${{ vars.DOCS_DEPLOY_BRANCH || 'main' }}
          fi
